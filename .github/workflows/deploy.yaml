name: Deploy Portfolio to github pages

on:
  push:
    branches:
      - main
    workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pages
        uses: actions/configure-pages@v5

      - name: Upload the artifacts to the runner
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page url}}
    steps:
      - name: Deploying to pages
        id: deployment
        uses: actions/deploy-pages@v4
        